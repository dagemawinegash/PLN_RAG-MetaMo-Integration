services:
  qdrant:
    image: qdrant/qdrant:latest
    ports:
      - "6333:6333"
    volumes:
      - qdrant_data:/qdrant/storage
    restart: unless-stopped

  pln-rag:
    build:
      context: ../PLN-RAG
      dockerfile: Dockerfile
    ports:
      - "8001:8000"
    environment:
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - OPENAI_MODEL=${OPENAI_MODEL:-openai/gpt-4o-mini}
      - OPENAI_BASE_URL=${OPENAI_BASE_URL:-}
      - PARSER=${PLNRAG_PARSER:-canonical_pln}
      - NL2PLN_MODULE_PATH=/app/data/simba_all.json
      - CANONICAL_PLN_NL2PLN_MODULE_PATH=/app/data/simba_canonical_pln.json
      - LANGEXTRACT_API_KEY=${LANGEXTRACT_API_KEY:-}
      - LANGEXTRACT_MODEL_ID=${LANGEXTRACT_MODEL_ID:-gpt-4o-mini}
      - LANGEXTRACT_MODEL_URL=${LANGEXTRACT_MODEL_URL:-}
      - LANGEXTRACT_EXAMPLES_PATH=/app/data/langextract_examples.json
      - LANGEXTRACT_EXTRACTION_PASSES=${LANGEXTRACT_EXTRACTION_PASSES:-1}
      - LANGEXTRACT_MAX_WORKERS=${LANGEXTRACT_MAX_WORKERS:-1}
      - LANGEXTRACT_SKIP_FUZZY=${LANGEXTRACT_SKIP_FUZZY:-true}
      - LANGEXTRACT_CHUNK_SIZE=${LANGEXTRACT_CHUNK_SIZE:-512}
      - QDRANT_URL=http://qdrant:6333
      - OLLAMA_URL=${OLLAMA_URL:-http://host.docker.internal:11434/api/embeddings}
      - OLLAMA_MODEL=${OLLAMA_MODEL:-nomic-embed-text}
      - ATOMSPACE_PATH=/app/data/atomspace/kb.metta
      - FAISS_PATH=/app/data/faiss
      - CHAINING_TIMEOUT=${CHAINING_TIMEOUT:-180}
      - CHAINING_MAX_STEPS=${CHAINING_MAX_STEPS:-100}
      - QUERY_FALLBACK_ENABLED=${QUERY_FALLBACK_ENABLED:-true}
      - QUERY_CANDIDATE_MAX_TRIES=${QUERY_CANDIDATE_MAX_TRIES:-5}
      - CONCEPTNET_ENABLED=${CONCEPTNET_ENABLED:-false}
      - CONCEPTNET_AUTOLOAD=${CONCEPTNET_AUTOLOAD:-true}
      - CONCEPTNET_INPUT_FILE=/app/data/conceptnet/conceptnet-assertions-5.7.0.csv.gz
      - CONCEPTNET_ATOMSPACE_PATH=/app/data/conceptnet/conceptnet_background.metta
      - CONCEPTNET_VECTOR_PAYLOAD_PATH=/app/data/conceptnet/conceptnet_background.jsonl
      - CONCEPTNET_MANIFEST_PATH=/app/data/conceptnet/conceptnet_manifest.json
      - CONCEPTNET_INDEX_ON_STARTUP=${CONCEPTNET_INDEX_ON_STARTUP:-true}
      - CONCEPTNET_MIN_WEIGHT=${CONCEPTNET_MIN_WEIGHT:-2.0}
      - CONCEPTNET_COVERAGE_PERCENT=${CONCEPTNET_COVERAGE_PERCENT:-100.0}
      - CONCEPTNET_SAMPLE_SEED=${CONCEPTNET_SAMPLE_SEED:-42}
      - CONCEPTNET_AUTO_REBUILD_ON_CHANGE=${CONCEPTNET_AUTO_REBUILD_ON_CHANGE:-true}
      - CONCEPTNET_REINDEX_ON_RESET=${CONCEPTNET_REINDEX_ON_RESET:-true}
      - CONCEPTNET_STARTUP_FAIL_OPEN=${CONCEPTNET_STARTUP_FAIL_OPEN:-true}
    volumes:
      - pln_data:/app/data
      - ../PLN-RAG/data/simba_all.json:/app/data/simba_all.json
      - ../PLN-RAG/data/simba_canonical_pln.json:/app/data/simba_canonical_pln.json
      - ../PLN-RAG/data/langextract_examples.json:/app/data/langextract_examples.json
      - ../PLN-RAG/data/benchmarks:/app/data/benchmarks
      - ../PLN-RAG/data/conceptnet:/app/data/conceptnet
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - qdrant
    healthcheck:
      test:
        [
          "CMD",
          "python3",
          "-c",
          "import urllib.request,sys;sys.exit(0 if urllib.request.urlopen('http://localhost:8000/health', timeout=5).status==200 else 1)",
        ]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 20s
    restart: unless-stopped

  metamo:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8010:8000"
    env_file:
      - .env
    environment:
      - PLNRAG_BASE_URL=http://pln-rag:8000
    depends_on:
      pln-rag:
        condition: service_healthy
    command: ["sh", "-c", "python scripts/wait_for_pln.py && uvicorn api.main:app --host 0.0.0.0 --port 8000"]
    volumes:
      - ./logs:/app/logs
    restart: "no"

volumes:
  qdrant_data:
  pln_data:
